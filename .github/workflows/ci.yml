name: CI Estacion Espacial

on:
  push:
    branches: [ principal ]
  pull_request:
    branches: [ principal ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar código
      uses: actions/checkout@v4

    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Instalar dependencias
      run: npm install

    - name: Correr Tests
      run: npm test